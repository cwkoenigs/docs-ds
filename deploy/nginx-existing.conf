# Merge inside the site's existing server block (for example analytics.example.com).
# Example web root: /srv/www/docs-ds-public; adapt it to your deployment.
# Publish build/* to /srv/www/docs-ds-public/docs/ first.
# Keep existing TLS, authentication, and other location blocks intact.
location = /docs {
    return 301 /docs/;
}

location /docs/ {
    root /srv/www/docs-ds-public;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /docs/404.html;
    # Redirects for directory paths must be relative so they keep the public
    # HTTPS host and port instead of nginx's internal address.
    absolute_redirect off;
    # Do NOT put add_header here: an add_header inside a location block
    # replaces every add_header inherited from the server block, which would
    # silently drop the host's existing security headers (HSTS, CSP, etc.).
    # Set X-Content-Type-Options at the server level instead if it is missing.
}
