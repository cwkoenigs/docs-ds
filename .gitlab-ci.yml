stages:
  - build

# Builds the empty shell to prove it still renders. The portal pipeline lives in the canon
# repository and calls this shell through `ds docs portal`.
# Replace <docs-runner-tag> with your configured shell runner's tag.
# The runner must provide Node.js 26; shell executors do not use image:.
build_docs:
  stage: build
  tags:
    - '<docs-runner-tag>'
  script:
    - node --version
    - npm ci --no-fund --no-audit
    - npm run validate
  artifacts:
    paths:
      - build/
    expire_in: 1 week
