<!-- @dsCard height=320 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--ifm-background-color); }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; }
  .cover svg { position: absolute; inset: 0; display: block; }
  .ink { fill: var(--ifm-font-color-base); }
  .brand { fill: var(--ifm-color-primary); }
  .tint { fill: var(--ifm-color-primary-lightest); }
  .deep { fill: var(--ifm-color-primary-darkest); }
  .block { rx: var(--ifm-global-radius); }
  .name { position: absolute; left: 40px; bottom: 36px; max-width: 440px; margin: 0; font-family: var(--font-heading); font-size: 112px; font-weight: 500; line-height: 0.95; letter-spacing: -0.035em; color: var(--ifm-font-color-base); }
  .tagline { position: absolute; left: 40px; bottom: 16px; max-width: 440px; margin: 0; font-family: var(--font-base); font-size: 13px; line-height: 1.4; color: var(--ifm-color-content-secondary); }
</style>
</head>
<body>
  <div class="cover">
    <!--
      blocks: ifm-font-color-base 480×68 (the navbar band, ifm-navbar-height tall) · ifm-color-primary 136×250 (2 × ifm-navbar-height wide) · ifm-color-primary-lightest 344×250 (the reading surface) · ifm-color-primary-darkest 280×114 (doc-sidebar-width wide, bleeding off bottom-right)
      arrangement: a strip of unequal bands — the navbar slab across the top of the box, the page beneath it split into a teal column and the tinted surface, the sidebar-width block over the surface's corner
      pattern: the editorial row, a few hairline rules — "Edges are drawn with 2px rules in ifm-color-primary: under the navbar, left of the active sidebar link"; five 2px ifm-color-primary rules: the navbar rule, three across the surface at the h2 pitch, one vertical at the sidebar edge
      scales: ifm-navbar-height 68px and multiples, doc-sidebar-width 280px, h2 margin-top 2.25rem = 36px pitch, rule 2px; corners ifm-global-radius 0 (square)
    -->
    <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
      <rect class="ink block" x="480" y="0" width="480" height="68"/>
      <rect class="brand" x="480" y="68" width="480" height="2"/>
      <rect class="brand block" x="480" y="70" width="136" height="250"/>
      <rect class="tint block" x="616" y="70" width="344" height="250"/>
      <rect class="brand" x="636" y="106" width="304" height="2"/>
      <rect class="brand" x="636" y="142" width="304" height="2"/>
      <rect class="brand" x="636" y="178" width="304" height="2"/>
      <rect class="brand" x="680" y="70" width="2" height="136"/>
      <rect class="deep block" x="680" y="206" width="280" height="114"/>
    </svg>
    <p class="name">Data<br>Science</p>
    <p class="tagline">Team knowledge, project context, and the ds-cli guide</p>
  </div>
</body>
</html>
