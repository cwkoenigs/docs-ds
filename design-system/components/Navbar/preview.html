<!-- @dsCard group="Site chrome" height=96 subtitle="Static rendition of the themed Docusaurus navbar" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--ifm-background-color); font-family: var(--font-base); }
  .navbar { display: flex; align-items: center; box-sizing: border-box; height: var(--ifm-navbar-height); padding: 0 1rem; background: var(--ifm-navbar-background-color); border-bottom: var(--rule-width) solid var(--ifm-color-primary); box-shadow: var(--ifm-navbar-shadow); }
  .navbar__brand { display: flex; align-items: center; gap: var(--space-brand-gap); margin-right: 1.5rem; color: var(--ifm-navbar-link-color); text-decoration: none; }
  .navbar__brand img { display: block; width: var(--navbar-logo-size); height: var(--navbar-logo-size); }
  .navbar__title { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 500; letter-spacing: -0.035em; }
  .navbar__link { padding: 0.25rem 0.75rem; color: var(--ifm-navbar-link-color); font-size: 1rem; font-weight: 500; text-decoration: none; }
  .navbar__link:hover, .navbar__link--active { color: var(--ifm-navbar-link-hover-color); }
  .navbar__link--active { text-decoration: underline; text-underline-offset: var(--underline-offset-navbar); }
  .navbar__right { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .navbar__search { display: flex; align-items: center; gap: 0.5rem; box-sizing: border-box; min-height: var(--navbar-search-input-min-height); padding: 0 0.6rem; border-radius: var(--ifm-global-radius); background: var(--ifm-navbar-search-input-background-color); color: var(--ifm-navbar-search-input-placeholder-color); font-size: 0.875rem; }
  .navbar__search kbd { padding: 0 0.3rem; border: 1px solid var(--ifm-navbar-search-input-placeholder-color); border-radius: var(--ifm-global-radius); font-family: var(--font-base); font-size: 0.75rem; color: var(--ifm-navbar-search-input-placeholder-color); }
  .navbar__toggle { color: var(--ifm-navbar-link-color); font-size: 1rem; }
  .navbar :focus-visible { outline: var(--focus-ring-width) solid var(--ifm-navbar-link-hover-color); outline-offset: var(--focus-ring-offset); }
</style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar__brand" href="#"><img src="/_blob/71afa8cd605343b8f8e5ba425d252ff6" alt=""><span class="navbar__title">Data Science</span></a>
    <a class="navbar__link navbar__link--active" href="#">Docs</a>
    <a class="navbar__link" href="#">Standards</a>
    <div class="navbar__right">
      <span class="navbar__search">Search <kbd>⌘</kbd><kbd>K</kbd></span>
      <span class="navbar__toggle" aria-label="Switch color mode">◐</span>
    </div>
  </nav>
</body>
</html>
